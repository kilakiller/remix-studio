<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remix Studio · 零乐理混音台</title>
<style>
  :root {
    --bg: #141414;
    --panel: #1e1e1e;
    --panel-2: #262626;
    --line: #333;
    --text: #e8e8e8;
    --dim: #9a9a9a;
    --accent: #ff8c42;
    --accent-2: #ffd166;
    --danger: #e05b5b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 24px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  header .sub { color: var(--dim); font-size: 13px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }

  /* 加载区 */
  #dropzone {
    border: 2px dashed var(--line);
    border-radius: 10px;
    padding: 34px 20px;
    text-align: center;
    color: var(--dim);
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  #dropzone:hover, #dropzone.over { border-color: var(--accent); color: var(--text); }
  #dropzone .big { font-size: 16px; margin-bottom: 6px; color: var(--text); }
  #dropzone .tip { font-size: 12px; }

  /* 波形区 */
  #waveBox { display: none; }
  #waveCanvas {
    width: 100%; height: 180px; display: block;
    background: var(--panel-2); border-radius: 8px; cursor: crosshair;
  }
  .wave-hint { font-size: 12px; color: var(--dim); margin-top: 8px; }
  .wave-hint b { color: var(--accent-2); font-weight: 600; }

  /* 走带控制 */
  .transport { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 18px; cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  button:hover { background: #2e2e2e; border-color: #444; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1a1a; font-weight: 600; }
  button.primary:hover { background: #ff9d5c; }
  button.on { background: var(--accent-2); border-color: var(--accent-2); color: #1a1a1a; font-weight: 600; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #timeLabel { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 14px; margin-left: auto; }

  /* 参数旋钮行 */
  .knobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
  .knob label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
  .knob label .val { color: var(--accent-2); font-variant-numeric: tabular-nums; }
  .knob input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .knob .desc { font-size: 11px; color: var(--dim); margin-top: 6px; }

  /* 预设 */
  .presets { display: flex; gap: 10px; flex-wrap: wrap; }
  .section-title { font-size: 13px; color: var(--dim); letter-spacing: 2px; margin-bottom: 12px; }

  #exportBtn { width: 100%; padding: 12px; font-size: 15px; }
  .footer-note { text-align: center; color: var(--dim); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>REMIX STUDIO</h1>
    <span class="sub">零乐理混音台 · 拖歌进来，拧旋钮，导出</span>
  </header>

  <!-- 加载 -->
  <div class="panel">
    <div id="dropzone">
      <div class="big">把一首歌拖到这里（mp3 / wav / ogg / m4a）</div>
      <div class="tip">或点击选择文件</div>
      <input type="file" id="fileInput" accept="audio/*" hidden>
    </div>
  </div>

  <!-- 波形与循环 -->
  <div class="panel" id="waveBox">
    <canvas id="waveCanvas"></canvas>
    <div class="wave-hint">
      <b>单击</b> 跳转播放位置 · <b>拖选</b> 一段区域后按「循环片段」即可反复循环那一小段（remix 核心玩法）
    </div>
  </div>

  <!-- 走带 -->
  <div class="panel">
    <div class="transport">
      <button id="playBtn" class="primary" disabled>播放</button>
      <button id="stopBtn" disabled>停止</button>
      <button id="loopBtn" disabled>循环片段</button>
      <button id="clearLoopBtn" disabled>取消循环</button>
      <span id="timeLabel">00:00 / 00:00</span>
    </div>
  </div>

  <!-- 参数 -->
  <div class="panel">
    <div class="section-title">声音参数</div>
    <div class="knobs">
      <div class="knob">
        <label><span>速度</span><span class="val" id="speedVal">1.00x</span></label>
        <input type="range" id="speed" min="0.5" max="2" step="0.01" value="1">
        <div class="desc">放慢 + 混响 = 经典 slowed 风；加快 = Nightcore</div>
      </div>
      <div class="knob">
        <label><span>混响</span><span class="val" id="reverbVal">0%</span></label>
        <input type="range" id="reverb" min="0" max="1" step="0.01" value="0">
        <div class="desc">空间感，像在教堂/浴室里放歌</div>
      </div>
      <div class="knob">
        <label><span>回声</span><span class="val" id="delayVal">0%</span></label>
        <input type="range" id="delay" min="0" max="1" step="0.01" value="0">
        <div class="desc">山谷式回声，叠加节奏感</div>
      </div>
      <div class="knob">
        <label><span>闷音滤波</span><span class="val" id="filterVal">100%</span></label>
        <input type="range" id="filter" min="0" max="1" step="0.01" value="1">
        <div class="desc">往左拧声音变闷，像水下 / 隔壁房间</div>
      </div>
      <div class="knob">
        <label><span>低音增强</span><span class="val" id="bassVal">0 dB</span></label>
        <input type="range" id="bass" min="0" max="15" step="0.5" value="0">
        <div class="desc">轰头低音，车载 / 夜店味</div>
      </div>
      <div class="knob">
        <label><span>音量</span><span class="val" id="volumeVal">80%</span></label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
        <div class="desc">主输出音量</div>
      </div>
    </div>
  </div>

  <!-- 预设 -->
  <div class="panel">
    <div class="section-title">一键风格预设（不懂乐理就直接点）</div>
    <div class="presets">
      <button class="preset" data-p="original">原声</button>
      <button class="preset" data-p="slowed">慢速混响 Slowed</button>
      <button class="preset" data-p="nightcore">Nightcore 加速</button>
      <button class="preset" data-p="underwater">水下闷音</button>
      <button class="preset" data-p="bassboost">低音轰炸</button>
      <button class="preset" data-p="echo">回声空间</button>
      <button class="preset" data-p="vapor">蒸汽波 Vaporwave</button>
    </div>
  </div>

  <!-- 导出 -->
  <div class="panel">
    <button id="exportBtn" class="primary" disabled>导出 Remix 为 WAV 文件</button>
    <div class="footer-note">导出会带着当前所有参数与循环设置，离线渲染，速度与播放无关</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- 状态 ----------
  let audioCtx = null;
  let audioBuffer = null;
  let source = null;
  let startedAt = 0;        // audioCtx.currentTime 时刻
  let startOffset = 0;      // buffer 内偏移（秒，原始 buffer 坐标）
  let isPlaying = false;
  let selection = null;     // {start, end} buffer 秒
  let loopEnabled = false;
  let fileName = 'remix';

  // 效果节点（实时链）
  let nodes = null;

  const $ = id => document.getElementById(id);
  const canvas = $('waveCanvas');
  const ctx2d = canvas.getContext('2d');

  const params = {
    speed: 1, reverb: 0, delay: 0, filter: 1, bass: 0, volume: 0.8
  };

  // ---------- 音频图 ----------
  function ensureCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function makeImpulse(ctx, seconds, decay) {
    const rate = ctx.sampleRate;
    const len = rate * seconds;
    const impulse = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const data = impulse.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return impulse;
  }

  // 滤波滑条 0..1 → 低通截止频率（对数映射 200Hz..18000Hz）
  function filterFreq(v) {
    return 200 * Math.pow(90, v); // v=1 → 18000Hz
  }

  function buildChain(ctx, destination) {
    const input = ctx.createGain();
    const lowpass = ctx.createBiquadFilter();
    lowpass.type = 'lowpass';
    lowpass.frequency.value = filterFreq(params.filter);

    const bassBoost = ctx.createBiquadFilter();
    bassBoost.type = 'lowshelf';
    bassBoost.frequency.value = 200;
    bassBoost.gain.value = params.bass;

    // 延迟 send/return
    const delaySend = ctx.createGain();
    const delayNode = ctx.createDelay(2);
    delayNode.delayTime.value = 0.35;
    const delayFb = ctx.createGain();
    delayFb.gain.value = 0.4;
    const delayReturn = ctx.createGain();

    // 混响 send/return
    const reverbSend = ctx.createGain();
    const convolver = ctx.createConvolver();
    convolver.buffer = makeImpulse(ctx, 2.5, 2.8);
    const reverbReturn = ctx.createGain();

    const master = ctx.createGain();

    input.connect(lowpass);
    lowpass.connect(bassBoost);
    bassBoost.connect(master);

    bassBoost.connect(delaySend);
    delaySend.connect(delayNode);
    delayNode.connect(delayFb);
    delayFb.connect(delayNode);
    delayNode.connect(delayReturn);
    delayReturn.connect(master);

    bassBoost.connect(reverbSend);
    reverbSend.connect(convolver);
    convolver.connect(reverbReturn);
    reverbReturn.connect(master);

    master.connect(destination);

    applyParamsTo({
      lowpass, bassBoost, delaySend, delayReturn, reverbSend, reverbReturn, master
    });

    return { input, lowpass, bassBoost, delaySend, delayReturn, reverbSend, reverbReturn, master };
  }

  function applyParamsTo(n) {
    n.lowpass.frequency.value = filterFreq(params.filter);
    n.bassBoost.gain.value = params.bass;
    n.delaySend.gain.value = params.delay * 0.8;
    n.delayReturn.gain.value = params.delay;
    n.reverbSend.gain.value = params.reverb;
    n.reverbReturn.gain.value = params.reverb * 0.9;
    n.master.gain.value = params.volume;
  }

  function applyParams() {
    if (nodes) applyParamsTo(nodes);
    if (source) source.playbackRate.value = params.speed;
  }

  // ---------- 播放控制 ----------
  function currentPos() {
    if (!audioBuffer) return 0;
    if (isPlaying && source) {
      return startOffset + (audioCtx.currentTime - startedAt) * params.speed;
    }
    return startOffset;
  }

  function play(fromOffset) {
    if (!audioBuffer) return;
    ensureCtx();
    stopSource();
    if (!nodes) nodes = buildChain(audioCtx, audioCtx.destination);

    source = audioCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.playbackRate.value = params.speed;

    if (loopEnabled && selection) {
      source.loop = true;
      source.loopStart = selection.start;
      source.loopEnd = selection.end;
    }
    source.connect(nodes.input);

    startOffset = (fromOffset !== undefined) ? fromOffset : startOffset;
    if (startOffset >= audioBuffer.duration) startOffset = 0;
    startedAt = audioCtx.currentTime;
    source.start(0, startOffset);
    source.onended = function () {
      // 自然播完（非循环）时复位
      if (isPlaying && !(loopEnabled && selection) && currentPos() >= audioBuffer.duration - 0.05) {
        isPlaying = false;
        startOffset = 0;
        $('playBtn').textContent = '播放';
      }
    };
    isPlaying = true;
    $('playBtn').textContent = '暂停';
  }

  function stopSource() {
    if (source) {
      source.onended = null;
      try { source.stop(); } catch (e) {}
      source.disconnect();
      source = null;
    }
  }

  function pause() {
    if (!isPlaying) return;
    startOffset = currentPos();
    stopSource();
    isPlaying = false;
    $('playBtn').textContent = '播放';
  }

  $('playBtn').addEventListener('click', () => {
    if (isPlaying) pause(); else play();
  });

  $('stopBtn').addEventListener('click', () => {
    pause();
    startOffset = 0;
    drawWave();
  });

  $('loopBtn').addEventListener('click', () => {
    if (!selection) return;
    loopEnabled = !loopEnabled;
    $('loopBtn').classList.toggle('on', loopEnabled);
    if (isPlaying) play(selection.start);
  });

  $('clearLoopBtn').addEventListener('click', () => {
    loopEnabled = false;
    selection = null;
    $('loopBtn').classList.remove('on');
    if (isPlaying) play(0); else drawWave();
  });

  // ---------- 文件加载 ----------
  const dropzone = $('dropzone');
  const fileInput = $('fileInput');
  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
  });
  ['dragover', 'dragleave', 'drop'].forEach(ev => {
    dropzone.addEventListener(ev, e => {
      e.preventDefault();
      dropzone.classList.toggle('over', ev === 'dragover');
      if (ev === 'drop' && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });
  });

  async function loadFile(file) {
    ensureCtx();
    fileName = file.name.replace(/\.[^.]+$/, '');
    const buf = await file.arrayBuffer();
    try {
      audioBuffer = await audioCtx.decodeAudioData(buf);
    } catch (e) {
      alert('无法解码这个音频文件，请换 mp3 / wav 试试');
      return;
    }
    pause();
    startOffset = 0;
    selection = null;
    loopEnabled = false;
    $('loopBtn').classList.remove('on');
    dropzone.querySelector('.big').textContent = file.name;
    dropzone.querySelector('.tip').textContent =
      formatTime(audioBuffer.duration) + ' · 可再拖一首来替换';
    $('waveBox').style.display = 'block';
    ['playBtn', 'stopBtn', 'loopBtn', 'clearLoopBtn', 'exportBtn'].forEach(id => $(id).disabled = false);
    resizeCanvas();
    drawWave();
  }

  // ---------- 波形绘制 ----------
  let peaks = null;
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    if (audioBuffer) computePeaks();
  }

  function computePeaks() {
    const data = audioBuffer.getChannelData(0);
    const width = Math.floor(canvas.width);
    peaks = new Float32Array(width);
    const block = Math.floor(data.length / width);
    for (let i = 0; i < width; i++) {
      let max = 0;
      const start = i * block;
      for (let j = 0; j < block; j += Math.max(1, Math.floor(block / 64))) {
        const v = Math.abs(data[start + j] || 0);
        if (v > max) max = v;
      }
      peaks[i] = max;
    }
  }

  function xToSec(x) {
    return (x / canvas.width) * audioBuffer.duration;
  }
  function secToX(sec) {
    return (sec / audioBuffer.duration) * canvas.width;
  }

  function drawWave() {
    if (!audioBuffer || !peaks) return;
    const w = canvas.width, h = canvas.height;
    ctx2d.clearRect(0, 0, w, h);

    // 选区背景
    if (selection) {
      ctx2d.fillStyle = loopEnabled ? 'rgba(255,140,66,0.18)' : 'rgba(255,209,102,0.12)';
      const sx = secToX(selection.start), ex = secToX(selection.end);
      ctx2d.fillRect(sx, 0, ex - sx, h);
    }

    // 波形
    ctx2d.fillStyle = '#c9c9c9';
    const mid = h / 2;
    for (let i = 0; i < peaks.length; i++) {
      const ph = Math.max(1, peaks[i] * (h * 0.46));
      ctx2d.fillRect(i, mid - ph, 1, ph * 2);
    }

    // 选区边框
    if (selection) {
      ctx2d.fillStyle = 'rgba(255,140,66,0.9)';
      ctx2d.fillRect(secToX(selection.start), 0, 2, h);
      ctx2d.fillRect(secToX(selection.end) - 2, 0, 2, h);
    }

    // 播放头
    const px = secToX(Math.min(currentPos(), audioBuffer.duration));
    ctx2d.fillStyle = '#ff8c42';
    ctx2d.fillRect(px - 1, 0, 2, h);
  }

  // 画布交互：单击跳转，拖选循环区
  let dragStart = null, dragging = false;
  canvas.addEventListener('mousedown', e => {
    if (!audioBuffer) return;
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    dragStart = (e.clientX - rect.left) * dpr;
    dragging = false;
  });
  canvas.addEventListener('mousemove', e => {
    if (dragStart === null || !audioBuffer) return;
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const x = (e.clientX - rect.left) * dpr;
    if (Math.abs(x - dragStart) > 4) dragging = true;
    if (dragging) {
      const a = xToSec(Math.min(dragStart, x));
      const b = xToSec(Math.max(dragStart, x));
      selection = { start: Math.max(0, a), end: Math.min(audioBuffer.duration, b) };
      drawWave();
    }
  });
  window.addEventListener('mouseup', e => {
    if (dragStart === null || !audioBuffer) { dragStart = null; return; }
    if (!dragging) {
      // 单击 → 跳转
      startOffset = xToSec(dragStart);
      if (isPlaying) play(startOffset); else drawWave();
    } else if (selection && selection.end - selection.start < 0.05) {
      selection = null;
      drawWave();
    }
    dragStart = null;
    dragging = false;
  });

  // ---------- 参数绑定 ----------
  function bindSlider(id, key, fmt) {
    const el = $(id), val = $(id + 'Val');
    el.addEventListener('input', () => {
      params[key] = parseFloat(el.value);
      val.textContent = fmt(params[key]);
      applyParams();
    });
    el.value = params[key];
    val.textContent = fmt(params[key]);
  }
  const fmtX = v => v.toFixed(2) + 'x';
  const fmtPct = v => Math.round(v * 100) + '%';
  const fmtDb = v => (v > 0 ? '+' : '') + v + ' dB';

  bindSlider('speed', 'speed', fmtX);
  bindSlider('reverb', 'reverb', fmtPct);
  bindSlider('delay', 'delay', fmtPct);
  bindSlider('filter', 'filter', fmtPct);
  bindSlider('bass', 'bass', fmtDb);
  bindSlider('volume', 'volume', fmtPct);

  // ---------- 预设 ----------
  const presets = {
    original:   { speed: 1,    reverb: 0,    delay: 0,    filter: 1,    bass: 0 },
    slowed:     { speed: 0.78, reverb: 0.55, delay: 0,    filter: 0.9,  bass: 3 },
    nightcore:  { speed: 1.3,  reverb: 0.08, delay: 0.1,  filter: 1,    bass: 0 },
    underwater: { speed: 0.92, reverb: 0.35, delay: 0,    filter: 0.28, bass: 4 },
    bassboost:  { speed: 1,    reverb: 0.05, delay: 0,    filter: 1,    bass: 12 },
    echo:       { speed: 1,    reverb: 0.25, delay: 0.7,  filter: 0.95, bass: 0 },
    vapor:      { speed: 0.7,  reverb: 0.5,  delay: 0.25, filter: 0.7,  bass: 2 }
  };

  const sliderFmt = {
    speed: ['speed', fmtX], reverb: ['reverb', fmtPct], delay: ['delay', fmtPct],
    filter: ['filter', fmtPct], bass: ['bass', fmtDb]
  };

  document.querySelectorAll('.preset').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = presets[btn.dataset.p];
      Object.assign(params, p);
      for (const key in sliderFmt) {
        const [id, fmt] = sliderFmt[key];
        $(id).value = params[key];
        $(id + 'Val').textContent = fmt(params[key]);
      }
      applyParams();
      document.querySelectorAll('.preset').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
    });
  });

  // ---------- 导出 WAV ----------
  function bufferToWav(buffer) {
    const numCh = buffer.numberOfChannels;
    const rate = buffer.sampleRate;
    const len = buffer.length;
    const bytesPerSample = 2;
    const blockAlign = numCh * bytesPerSample;
    const dataSize = len * blockAlign;
    const out = new ArrayBuffer(44 + dataSize);
    const view = new DataView(out);
    const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };

    writeStr(0, 'RIFF');
    view.setUint32(4, 36 + dataSize, true);
    writeStr(8, 'WAVE');
    writeStr(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numCh, true);
    view.setUint32(24, rate, true);
    view.setUint32(28, rate * blockAlign, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, 16, true);
    writeStr(36, 'data');
    view.setUint32(40, dataSize, true);

    const chans = [];
    for (let c = 0; c < numCh; c++) chans.push(buffer.getChannelData(c));
    let off = 44;
    for (let i = 0; i < len; i++) {
      for (let c = 0; c < numCh; c++) {
        let s = Math.max(-1, Math.min(1, chans[c][i]));
        view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        off += 2;
      }
    }
    return new Blob([out], { type: 'audio/wav' });
  }

  // 离线渲染当前设置，返回 AudioBuffer
  async function renderBuffer() {
    if (!audioBuffer) throw new Error('还没有加载音频');
    const rate = audioBuffer.sampleRate;
    const dur = audioBuffer.duration / params.speed + 4; // 尾音余量
    const offCtx = new OfflineAudioContext(2, Math.ceil(dur * rate), rate);
    const chain = buildChain(offCtx, offCtx.destination);
    chain.master.gain.value = params.volume;

    const src = offCtx.createBufferSource();
    src.buffer = audioBuffer;
    src.playbackRate.value = params.speed;
    src.connect(chain.input);
    if (loopEnabled && selection) {
      src.loop = true;
      src.loopStart = selection.start;
      src.loopEnd = selection.end;
      // 循环导出 8 遍，方便直接用
      src.start(0);
      src.stop(8 * (selection.end - selection.start) / params.speed + 2);
    } else {
      src.start(0);
    }
    return offCtx.startRendering();
  }

  // 离线渲染当前设置，返回 WAV Blob（导出与自动化测试共用）
  async function renderMix() {
    return bufferToWav(await renderBuffer());
  }

  $('exportBtn').addEventListener('click', async () => {
    if (!audioBuffer) return;
    const btn = $('exportBtn');
    btn.disabled = true;
    btn.textContent = '正在离线渲染…';
    try {
      const blob = await renderMix();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName + '_remix.wav';
      a.click();
      URL.revokeObjectURL(a.href);
    } catch (e) {
      alert('导出失败：' + e.message);
    }
    btn.disabled = false;
    btn.textContent = '导出 Remix 为 WAV 文件';
  });

  // 供控制台调试 / 自动化测试使用
  window.RemixStudio = {
    loadFile: loadFile,
    renderMix: renderMix,
    renderBuffer: renderBuffer,
    state: () => ({
      loaded: !!audioBuffer,
      duration: audioBuffer ? audioBuffer.duration : 0,
      playing: isPlaying,
      position: currentPos(),
      loop: loopEnabled,
      selection: selection,
      params: Object.assign({}, params)
    })
  };

  // ---------- 时钟 ----------
  function formatTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return m + ':' + s;
  }

  function tick() {
    if (audioBuffer) {
      $('timeLabel').textContent = formatTime(currentPos()) + ' / ' + formatTime(audioBuffer.duration);
      drawWave();
    }
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize', () => { resizeCanvas(); drawWave(); });
  tick();
})();
</script>
</body>
</html>
